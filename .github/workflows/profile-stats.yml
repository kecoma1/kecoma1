name: Update profile stats

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-stats.yml
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HAS_PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light stats card
        if: env.HAS_PROFILE_STATS_TOKEN == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&hide_rank=true&hide=contribs&card_width=390&theme=default&disable_animations=true&number_format=long
          path: profile/stats-light.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"

      - name: Generate dark stats card
        if: env.HAS_PROFILE_STATS_TOKEN == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&hide_rank=true&hide=contribs&card_width=390&theme=github_dark&disable_animations=true&number_format=long
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=Jupyter%20Notebook,Rich%20Text%20Format&card_width=330&theme=default&disable_animations=true
          path: profile/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=Jupyter%20Notebook,Rich%20Text%20Format&card_width=330&theme=github_dark&disable_animations=true
          path: profile/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(profile): refresh github stats"
          git push
